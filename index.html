],["Zustand","small hook-based store","012","Frontend state, data & forms (JS/TS)"],["zx","Google's shell scripting in JS","2","CLI frameworks"],["µGFX","","0","Embedded, IoT & hardware UI"],["Übersicht","macOS desktop widgets in JSX","023","Browser extensions & plugin platforms"],["übersicht widgets","","1","macOS and Apple native"]],"stats":{"a0":1807,"a1":2429,"a2":2265,"a3":638,"types":128,"names":3810},"repo":"https://github.com/calmmage/app-tech-catalog","story":"# Multi-phase brainstorm: every way to build an app\n\n\"\"\"\nmake me a full list of all possible techs and frameworks to do an app\n\"\"\"\nOne go: 2,265 names.\n\n\"\"\"\nPhase 1 (opus) - do CATEGORIES of apps\nPhase 2 (multiple subagents) - each category generates 3-5 options.\n\"\"\"\n128 types, 638 picks, 61% new: notch app, receipt printer, app in a font.\n\nAnother chat, \"Rust?\": 4 options = 4 of 9 types.\n"};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => r.querySelectorAll(s);
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
const md = s => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
const LENS = { S: "structured", C: "community", W: "wild internet", I: "Instagram saves", N: "Petr's notes" };
const SRC = { 0: "direct list", 1: "list from Petr's words", 2: "spec list", 3: "app types" };
const VIEWS = ["types", "tech", "names", "story"];
const LEDE = {
  types: "<strong>What the app can be</strong> before what to build it with: 128 types of app, each with 3–5 picks running from the plain default to the odd one. Tags show which lens found the type.",
  tech: "<strong>Every framework, language and engine</strong>, by section: 2,265 names from the spec list, checked with web searches on 6 Nov 2026.",
  names: "<strong>All four lists merged</strong> into one A–Z index. Digits after a name show which lists have it: 0 direct, 1 Petr's words, 2 spec, 3 app types.",
  story: "",
};
const rendered = {};
const num = n => n.toLocaleString("en-US");
const pick = (n, note) => `<b>${md(n)}</b>${note ? ` <span class="n">${md(note)}</span>` : ""}`;

function renderTypes() {
  let h = "";
  D.a3.forEach(b => {
    const picks = b.cats.reduce((n, c) => n + c.picks.length, 0);
    h += `<section class="sec batch"><h2>${esc(b.title.replace(/^Batch \d+ — /, ""))}<span class="meta">${b.cats.length} types · ${picks} picks</span></h2><div class="cats">`;
    b.cats.forEach(c => {
      h += `<article class="cat"><h3><span class="num">${c.n}</span><span class="ct">${esc(c.title)}</span><span class="tags">${c.tags.map(t => `<i title="${esc(LENS[t] || t)}">${t}</i>`).join("")}</span></h3><ul>`;
      c.picks.forEach(([n, note, link]) => {
        h += `<li>${pick(n, note)}${link ? `<a class="out" href="${esc(link)}" target="_blank" rel="noopener" aria-label="Open ${esc(n)}">↗</a>` : ""}</li>`;
      });
      h += "</ul></article>";
    });
    h += "</div></section>";
  });
  h += `<p class="lens">${Object.entries(LENS).map(([k, v]) => `<span><i>${k}</i>${esc(v)}</span>`).join("")}</p>`;
  $("#v-types").innerHTML = h;
}

function renderTech() {
  let nav = "", h = "";
  D.a2.forEach((s, i) => {
    const n = s.groups.reduce((a, g) => a + g.items.length, 0);
    nav += `<a href="#tech" data-sec="s${i}">${esc(s.title)}<span>${n}</span></a>`;
    h += `<section class="sec" id="s${i}"><h2>${esc(s.title)}<span class="meta">${n}</span></h2>`;
    s.groups.forEach(g => {
      h += `<div class="grp">${g.title ? `<h3>${esc(g.title)}</h3>` : ""}<ul class="items">${g.items.map(([n, note]) => `<li>${pick(n, note)}</li>`).join("")}</ul></div>`;
    });
    h += "</section>";
  });
  $("#v-tech").innerHTML = `<div class="tech"><nav class="secnav" aria-label="Sections">${nav}</nav><div>${h}</div></div>`;
  $$(".secnav a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    document.getElementById(a.dataset.sec).scrollIntoView({ block: "start" });
  }));
}

function renderNames() {
  const groups = {};
  D.names.forEach(r => {
    const ch = (r[0].replace(/^[^A-Za-z0-9]+/, "")[0] || "#").toUpperCase();
    (groups[/[A-Z]/.test(ch) ? ch : "#"] ||= []).push(r);
  });
  let h = "";
  Object.keys(groups).sort().forEach(k => {
    h += `<section class="sec"><div class="grp"><p class="letter">${k}</p><ul class="items">`;
    groups[k].forEach(([n, note, src, where]) => {
      const tip = `${src.split("").map(s => SRC[s]).join(", ")} · ${where}`;
      h += `<li title="${esc(tip)}"><b>${md(n)}</b><span class="src" aria-label="in lists ${src.split("").join(", ")}">${src.split("").map(x => `<i>${x}</i>`).join("")}</span>${note ? ` <span class="n">${md(note)}</span>` : ""}</li>`;
    });
    h += "</ul></div></section>";
  });
  $("#v-names").innerHTML = h;
}

function renderStory() {
  let h = "", inQ = false, buf = [];
  D.story.split("\n").forEach(l => {
    if (l.trim() === '"""') {
      if (inQ) { h += `<blockquote>${esc(buf.join("\n"))}</blockquote>`; buf = []; }
      inQ = !inQ; return;
    }
    if (inQ) { buf.push(l); return; }
    if (l.startsWith("# ")) h += `<h2>${esc(l.slice(2))}</h2>`;
    else if (l.trim()) h += `<p>${md(l)}</p>`;
  });
  const f = p => `lists/${p}`;
  const s = D.stats;
  h += `<h2>How it was made</h2>
  <p>One task, run four ways in parallel on 6 Nov 2026. The first three each made one flat list. The fourth made types first, then picks inside each type.</p>
  <div class="facts"><table>
    <thead><tr><th>List</th><th>Items</th><th>How</th></tr></thead>
    <tbody>
      <tr><td><a href="#types">App types</a> · <a href="${f("a3-app-types.md")}" target="_blank" rel="noopener">md</a></td><td class="n">${num(s.a3)} picks in ${s.types} types</td><td>Phase 1: five lenses (structured, community, wild internet, Petr's Instagram saves, Petr's notes) gave 240 categories, merged to 128 by the rule «not what can be IN type 1. instead what can BE type 1». Phase 2: 3–5 picks per type, one subagent per batch.</td></tr>
      <tr><td><a href="#tech">Spec list</a> · <a href="${f("a2-spec-catalog.md")}" target="_blank" rel="noopener">md</a></td><td class="n">${num(s.a2)}</td><td>Opus agent with a written <a href="${f("a2-spec.md")}" target="_blank" rel="noopener">spec</a>, 36 web searches.</td></tr>
      <tr><td>Petr's words · <a href="${f("a1-petr-words.md")}" target="_blank" rel="noopener">md</a></td><td class="n">${num(s.a1)}</td><td>Opus agent given the request in Petr's own words. From memory.</td></tr>
      <tr><td>Direct · <a href="${f("a0-direct.md")}" target="_blank" rel="noopener">md</a></td><td class="n">${num(s.a0)}</td><td>Claude answering directly. From memory.</td></tr>
    </tbody></table></div>
  <p>Together: ${num(s.names)} distinct names. 61% of the app-type picks appear in none of the flat lists.</p>
  <p>Checks: counts by script; five news claims in the spec list checked by web search, four right and one fixed. The shared search budget ran out during the run, so many short notes in the Petr's-words list and the app types were not web-checked.</p>`;
  $("#v-story").innerHTML = `<div class="story">${h}</div>`;
}

const RENDER = { types: renderTypes, tech: renderTech, names: renderNames, story: renderStory };
const txt = el => (el._t ??= el.textContent.toLowerCase());
const marked = new Set();
function unmark() { marked.forEach(el => { el.innerHTML = el._h; }); marked.clear(); }
function mark(el, q) {
  if (marked.size > 600) return;
  if (el._h === undefined) el._h = el.innerHTML;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const i = n.data.toLowerCase().indexOf(q);
    if (i < 0) return;
    const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + q.length);
    r.surroundContents(document.createElement("mark"));
  });
  marked.add(el);
}

function filter(view, q) {
  const root = $("#v-" + view);
  let shown = 0;
  unmark();
  const headHits = view !== "names";
  $$(".sec", root).forEach(sec => {
    const secHit = !q || (headHits && txt($("h2", sec)).includes(q));
    if (q && secHit) mark($("h2", sec), q);
    let secAny = false;
    $$(".grp, .cat", sec).forEach(g => {
      const head = $("h3", g);
      const gHit = secHit || (headHits && head && txt(head).includes(q));
      if (q && head && headHits && txt(head).includes(q)) mark(head, q);
      let any = false;
      $$("li", g).forEach(li => {
        const hit = gHit || txt(li).includes(q);
        li.hidden = !hit;
        if (hit) { any = true; shown++; if (q && txt(li).includes(q)) mark(li, q); }
      });
      g.hidden = !any;
      if (any) secAny = true;
    });
    sec.hidden = !secAny;
  });
  if (view === "tech") $$(".secnav a").forEach(a => { a.hidden = document.getElementById(a.dataset.sec).hidden; });
  $("#empty").hidden = !q || shown > 0;
  $("#status").textContent = q ? `${num(shown)} match${shown === 1 ? "" : "es"} for “${q}”` : "";
}

let current = "types";
function show() {
  let v = location.hash.slice(1);
  if (!VIEWS.includes(v)) v = "types";
  current = v;
  if (!rendered[v]) { RENDER[v](); rendered[v] = true; }
  VIEWS.forEach(x => { $("#v-" + x).hidden = x !== v; });
  $$(".tabs a").forEach(a => a.dataset.view === v ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $("#lede").innerHTML = LEDE[v];
  $("#lede").hidden = !LEDE[v];
  const q = $("#q").value.trim().toLowerCase();
  if (v === "story") { $("#status").textContent = ""; $("#empty").hidden = true; }
  else filter(v, q);
}

let timer;
$("#q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (current === "story") { location.hash = "names"; return; }
    filter(current, $("#q").value.trim().toLowerCase());
  }, 90);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; filter(current, ""); }
});
$("#repo").href = D.repo;
addEventListener("hashchange", show);
show();
</script>
